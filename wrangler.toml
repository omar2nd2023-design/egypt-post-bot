name = "egypt-post-bot"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# التخزين المؤقّت للتوكن (بيتحدّث من GitHub Actions)
[[kv_namespaces]]
binding = "KV"
id = "3ebd5cf4f20547f4a88e1b9948ccc22a"

# المتغيّرات غير السرّية
[vars]
GITHUB_REPO = "omar2nd2023-design/egypt-post-bot"
# خدمة التجديد على Orkestr — hostname عام، مش سر
RENEWER_URL = "https://egypt-post-f5-test.orkestr.run"

# السرّيات (بتتحط بـwrangler secret put، مش هنا):
#   TELEGRAM_BOT_TOKEN
#   TURSO_URL
#   TURSO_TOKEN
#   GITHUB_TOKEN
#   ADMIN_SECRET
#   WEBHOOK_SECRET
